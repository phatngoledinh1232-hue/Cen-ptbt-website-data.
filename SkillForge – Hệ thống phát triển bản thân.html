<script>

let tm;function save(){setS('Đang lưu…','warn');clearTimeout(tm);tm=setTimeout(async()=>{try{if(!db||noidb)throw 0;await preBak();await new Promise((a,b)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(S,'state');t.oncomplete=a;t.onerror=()=>b(t.error)});setS('Đã lưu trên thiết bị này','ok');if(bc)bc.postMessage(1)}catch(e){try{localStorage.setItem('sf',JSON.stringify(S));setS('Đã lưu (dự phòng trình duyệt)','ok')}catch(_){setS('Lỗi lưu dữ liệu','err')}}},200)}

let prev=null,cv='m',cq='',cs='new',cf='',gq='';const undoT=()=>{const t=$('#toast');t.innerHTML+=' <button class="b2 sm" data-a="undo" style="color:#fff">Hoàn tác</button>';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',7000)};
const conf=(m,cb)=>dlg(m,[],()=>{prev=JSON.stringify(S);cb();undoT()},'Xác nhận');

const TPL=Array.from({length:100},(_,i)=>{const g=i/20|0,k=i%20;return{id:i,name:GN[g]+' '+(k+1),g,k,h:(GH[g]+k*(g==0?3:g==4?5:11))%360,ang:[160,135,90,200,45][k%5]+k*7,fr:['solid','double','dashed','ridge','groove'][(k+g)%5],lay:k%3,rar:GR[k<10?0:k<17?1:2]}});

const snapOf=(s,ids)=>s.metrics.filter(m=>ids.includes(m.id)).map(m=>({id:m.id,n:m.name,p:pct(m),x:shown(m)}));
/* ---- các màn hình ---- */

async function initStore(){try{if(navigator.storage&&navigator.storage.persist)S2.persisted=await navigator.storage.persist();const e=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;if(e){S2.use=Math.round(e.usage/1024);S2.q=Math.round(e.quota/1048576)}}catch(_){}try{if(db)baks=(await kvp(0,s=>s.getAllKeys())).filter(k=>/^bak-/.test(k)).sort()}catch(_){}if(view==='set')render()}
A.rbak=i=>conf('Khôi phục bản tự sao lưu '+i.slice(4)+'? Dữ liệu hiện tại sẽ được thay thế.',async()=>{const d=await kvp(0,s=>s.get(i));if(d&&d.skills){S=Object.assign(seed(),d);S.set.bakDay=today();commit('Đã khôi phục bản '+i.slice(4))}});
const bc=window.BroadcastChannel?new BroadcastChannel('sf'):null;if(bc)bc.onmessage=async()=>{if(document.querySelector('.md')||!db)return;const d=await load();if(d&&d.skills){S=d;S.goals=S.goals||[];render();toast('Đã đồng bộ từ tab khác')}};
const hero=()=>{const dn=S.tasks.filter(t=>t.done).length,r=S.tasks.length?Math.round(dn/S.tasks.length*100):0,xp=S.xp.reduce((a,x)=>a+x.amt,0);return`<div class="pn hero"><div class="ring" style="--p:${r}"><i>${r}%</i></div><div><b style="font-size:1.1rem">Tiến trình của bạn</b><div class="mu">Chuỗi ${streak()} ngày · ${dn}/${S.tasks.length} nhiệm vụ · ${xp} XP</div><button class="b2 sm" data-a="nav" data-i="ai" style="margin-top:6px;color:#fff;border-color:#fff8">✨ Hỏi trợ lý AI</button></div></div>`};
const spark=s=>{const h=s.metrics.flatMap(m=>m.hist.map(x=>[x.date,Math.round(x.to/mx(m)*100)])).sort((a,b)=>a[0].localeCompare(b[0])).slice(-20);return h.length>1?`<div class="spark" title="Xu hướng các lần chấm gần nhất">${h.map(x=>`<i style="height:${Math.max(8,x[1])}%;background:${s.color}"></i>`).join('')}</div>`:''};
/* ---- Trợ lý AI (capability sample) ---- */
let ai={log:[],busy:0,sid:'',out:'',plan:null,draft:null,ctl:null},smp;
const smpl=async()=>{if(smp===undefined){try{smp=await claude.use('sample')}catch(_){smp=null}}return smp};
const AIE={not_granted:'Bạn chưa cho phép dùng Claude. Hãy bấm lại và chọn cho phép.',rate_limited:'Gọi quá nhanh, hãy thử lại sau ít phút.',aborted:'Đã dừng.'};
const aiCtx=()=>{const d7=new Date();d7.setDate(d7.getDate()-6);const s7=fmt(d7),r=S.tasks.filter(t=>t.date>=s7&&t.date<=today());return JSON.stringify({homNay:today(),kyNang:S.skills.filter(s=>!s.archived).map(s=>({ten:s.name,diemTb:avg(s)+'%',capDo:lvOf(xpOf(s.id)),chiSo:s.metrics.filter(m=>m.cur>0).slice(0,8).map(m=>m.name+': '+shown(m)+' (mục tiêu '+(m.scale==='st'?ST[m.target]:m.target)+')')})),nhiemVu7Ngay:{tong:r.length,xong:r.filter(t=>t.done).length},chuoiNgay:streak(),ngayBoLo:Object.values(S.days).filter(v=>v==3).length,mucTieu:S.goals.filter(g=>!g.done).slice(0,6).map(g=>g.title),danhGiaGanDay:S.assess.slice(-3).map(a=>({ngay:a.date,ky:sk(a.sid)?.name||'Tổng quan',tot:a.good,canCaiThien:a.improve}))})};
const BASE=()=>'Bạn là huấn luyện viên phát triển bản thân trong ứng dụng SkillForge. Trả lời tiếng Việt, ngắn gọn, thực tế, khích lệ. Không chẩn đoán y khoa; với sức khỏe và sức mạnh chỉ khuyên tăng tiến từ từ, nghỉ phục hồi, và nên hỏi chuyên gia khi đau hoặc có bệnh lý. Chỉ dựa trên dữ liệu được cung cấp, không bịa số liệu.\nDữ liệu người dùng (JSON): '+aiCtx();
const aiUp=()=>{if(view!=='ai')return;const o=$('#aiout');if(o)o.textContent=ai.out||(ai.busy?'Đang suy nghĩ…':'');const b=$('#aistop');if(b)b.style.display=ai.busy?'':'none';const q=$('#aibtns');if(q)q.classList.toggle('off',!!ai.busy)};
async function ask(input,json){if(ai.busy)return;const s=await smpl();if(!s){ai.out='Tính năng AI chỉ hoạt động khi mở trang trong Claude.';aiUp();return}ai.busy=1;ai.ctl=new AbortController();ai.out='';aiUp();try{if(json)return await s.json(input,{signal:ai.ctl.signal});const r=await s(input,{signal:ai.ctl.signal,cache:false,onText:({text})=>{ai.out=text;aiUp()}});ai.out='';return r.text}catch(e){ai.out=(AIE[e&&e.code]||'Không gọi được Claude ('+((e&&e.code)||'lỗi')+'). Thử lại sau.')+(e&&e.text?'\n\n'+e.text:'')}finally{ai.busy=0;ai.ctl=null;aiUp()}}
V.ai=()=>`<h2>✨ Trợ lý AI</h2><p class="mu">Khi bạn bấm hỏi, Claude đọc bản tóm tắt dữ liệu của bạn (kỹ năng, điểm, nhiệm vụ 7 ngày, mục tiêu, đánh giá gần đây), dùng lượt Claude của chính bạn và cần bạn cho phép lần đầu. Đây là gợi ý tham khảo, không phải tư vấn y khoa.</p><div class="row" id="aibtns"><button class="b" data-a="aian">Phân tích tiến bộ</button><button class="b2" data-a="aipl">Gợi ý kế hoạch 7 ngày</button></div><div class="pn" style="margin-top:10px"><b>Nháp đánh giá bản thân</b><div class="row"><select data-a="aisk" style="width:auto"><option value="">Tổng quan</option>${skOpts().map(o=>`<option value="${o[0]}" ${o[0]===ai.sid?'selected':''}>${esc(o[1])}</option>`).join('')}</select><button class="b2 sm" data-a="aidr">Viết nháp</button></div></div>${ai.plan?`<div class="pn"><b>Kế hoạch đề xuất</b>${ai.plan.map(p=>`<div class="row sp"><span>${p.date} · ${esc(p.title)}</span><span class="mu">${esc(sk(p.sid)?.name||'')} ${p.mins}′</span></div>`).join('')}<div class="row" style="margin-top:8px"><button class="b" data-a="aiadd">Thêm vào lịch</button><button class="b2" data-a="aino">Bỏ</button></div></div>`:''}${ai.draft?`<div class="pn"><b>Bản nháp đánh giá (${esc(sk(ai.draft.sid)?.name||'Tổng quan')})</b>${[['Làm tốt','good'],['Cần cải thiện','improve'],['Khó khăn','hard'],['Kế hoạch','plan'],['Lần sau','next']].map(([l,k])=>`<div><span class="mu">${l}:</span> ${esc(ai.draft[k])}</div>`).join('')}<div class="row" style="margin-top:8px"><button class="b" data-a="aisv">Lưu thành đánh giá</button><button class="b2" data-a="aino">Bỏ</button></div></div>`:''}<div class="pn">${ai.log.map(m=>`<div style="margin:6px 0;white-space:pre-wrap;${m.role==='user'?'text-align:right;color:var(--ac)':''}">${esc(m.content)}</div>`).join('')}<div id="aiout" style="white-space:pre-wrap">${esc(ai.out||(ai.busy?'Đang suy nghĩ…':''))}</div><button class="b2 sm dg" id="aistop" data-a="aistop" style="display:${ai.busy?'':'none'}">Dừng</button></div><div class="row"><input id="aiq" placeholder="Hỏi huấn luyện viên AI…" style="flex:1"><button class="b" data-a="aiq">Gửi</button></div>`;
A.aian=()=>ask(BASE()+'\n\nHãy phân tích tiến bộ của tôi: điểm mạnh, 2-3 điểm yếu nên ưu tiên và 3 hành động cụ thể cho tuần tới.');
A.aiq=async()=>{const el=$('#aiq'),q=el&&el.value.trim();if(!q||ai.busy)return;el.value='';const t=await ask([...ai.log.slice(-6),{role:'user',content:BASE()+'\n\nCâu hỏi: '+q}]);if(t){ai.log.push({role:'user',content:q},{role:'assistant',content:t});render()}};
A.aipl=async()=>{const r=await ask(BASE()+'\n\nHãy lập kế hoạch luyện tập 7 ngày bắt đầu từ '+today()+'. Chỉ trả về một mảng JSON, mỗi phần tử {"date":"YYYY-MM-DD","title":"...","skill":"tên kỹ năng đúng như trong dữ liệu hoặc chuỗi rỗng","mins":10-90,"note":"..."}, tối đa 14 phần tử, ưu tiên kỹ năng điểm thấp, có ngày nghỉ, tăng tiến vừa phải.',1);if(r){ai.plan=(Array.isArray(r)?r:[]).filter(x=>x&&/^\d{4}-\d\d-\d\d$/.test(x.date)&&String(x.title||'').trim()).slice(0,14).map(x=>({date:x.date,title:String(x.title).slice(0,80),sid:(S.skills.find(s=>s.name===x.skill)||{}).id||'',mins:Math.max(5,Math.min(180,+x.mins||30)),note:String(x.note||'').slice(0,200)}));ai.out=ai.plan.length?'':'AI chưa trả về kế hoạch hợp lệ, hãy thử lại.';render()}};
A.aiadd=()=>{const n=ai.plan.length;ai.plan.forEach(p=>S.tasks.push({id:uid(),done:false,...p}));ai.plan=null;commit('Đã thêm '+n+' nhiệm vụ vào lịch')};
A.aidr=async()=>{const s=sk(ai.sid),r=await ask(BASE()+'\n\nHãy viết bản nháp đánh giá bản thân '+(s?'cho kỹ năng "'+s.name+'"':'tổng quan')+' dựa trên dữ liệu, giọng nhẹ nhàng, không gây áp lực. Chỉ trả về một đối tượng JSON {"good":"","improve":"","hard":"","plan":"","next":""}.',1);if(r&&typeof r==='object'){ai.draft={sid:ai.sid,...Object.fromEntries(['good','improve','hard','plan','next'].map(k=>[k,String(r[k]||'').slice(0,600)]))};ai.out='';render()}};
A.aisv=()=>{S.assess.push({id:uid(),date:today(),score:'',ai:true,...ai.draft});ai.draft=null;commit('Đã lưu bản nháp thành đánh giá')};A.aino=()=>{ai.plan=null;ai.draft=null;render()};A.aistop=()=>{if(ai.ctl)ai.ctl.abort()};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiq')A.aiq()});
function migrate(){S.goals=S.goals||[];S.trash=S.trash||[];S.xp=S.xp||[];S.assess=S.assess||[];S.cards=S.cards||[];S.days=S.days||{};S.set=S.set||{};S.set.designs=S.set.designs||[];S.v=3;S.skills.forEach(s=>{s.metrics=s.metrics||[];s.metrics.forEach(m=>{m.hist=m.hist||[]})});S.cards.forEach(c=>{c.ver=c.ver||[];c.snap=c.snap||[]})}
function info(t,h){const d=document.createElement('div');d.className='md';d.innerHTML=`<div class="mf"><h3>${esc(t)}</h3>${h}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="b" id="x">Đóng</button></div></div>`;document.body.append(d);d.querySelector('#x').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}
const mvm=(i,d)=>{const[a,b]=i.split('|'),s=sk(a),j=s.metrics.findIndex(m=>m.id===b),k=j+d;if(k<0||k>=s.metrics.length)return;[s.metrics[j],s.metrics[k]]=[s.metrics[k],s.metrics[j]];commit()};
A.mup=i=>mvm(i,-1);A.mdn=i=>mvm(i,1);
A.mhs=i=>{const[a,b]=i.split('|'),m=sk(a).metrics.find(x=>x.id===b),f=v=>m.scale==='st'?ST[v]:v;info('Lịch sử: '+m.name,m.hist.length?`<div class="tbar" style="height:56px">${m.hist.map(h=>`<div title="${h.date}" style="height:${Math.round(h.to/mx(m)*100)}%"></div>`).join('')}</div>`+m.hist.slice().reverse().map(h=>`<div class="row sp"><span>${h.date}</span><b>${f(h.from)} → ${f(h.to)}</b></div>${h.note?`<div class="mu">${esc(h.note)}</div>`:''}`).join(''):'<p class="mu">Chưa có lần chấm điểm nào.</p>')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;A[b.dataset.a]?.(b.dataset.i)});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.a==='tg'){const t=S.tasks.find(t=>t.id===b.dataset.i);t.done=b.checked;S.xp=S.xp.filter(x=>x.tid!==t.id);if(t.done)addXp(t.sid,10+Math.round((t.mins||0)/6),'Hoàn thành: '+t.title,t.id);commit()}if(b.dataset.a==='theme'){S.set.theme=b.value;commit()}if(b.dataset.a==='qa'&&b.value.trim()){S.tasks.push({id:uid(),done:false,title:b.value.trim().slice(0,100),sid:'',mins:30,date:sel,note:''});commit('Đã thêm nhiệm vụ')}if(b.dataset.a==='aisk')ai.sid=b.value;if(b.dataset.a==='cg'){cg=b.value;render()}if(b.dataset.a==='dsg'){const d=(S.set.designs||[]).find(x=>x.id===b.value);if(d){Object.assign(W,{tpl:d.tpl,hue:d.hue,font:d.font});render()}}if(b.id==='im'&&b.files[0]){readImg(b.files[0],u=>{W.img=u;const p=$('#pv');if(p)p.innerHTML=pvHtml()})}if(b.dataset.a==='scs'){sc=b.value;loadW();render()}if(b.dataset.a==='pd'){pd=+b.value;render()}if(b.dataset.a==='tg'){tg=b.value;tn=24;render()}if(b.dataset.a==='cq'){cq=b.value;render()}if(b.dataset.a==='cf'){cf=b.value;render()}if(b.dataset.a==='cs'){cs=b.value;render()}if(b.dataset.a==='gq'){gq=b.value;render()}if(b.dataset.a==='gt'){const g=S.goals.find(g=>g.id===b.dataset.i);g.done=b.checked;S.xp=S.xp.filter(x=>x.tid!==g.id);if(g.done)addXp(g.sid,50,'Mục tiêu: '+g.title,g.id);commit()}});
addEventListener('online',()=>setS('Đã lưu trên thiết bị này','ok'));addEventListener('offline',()=>toast('Mất mạng: ứng dụng vẫn lưu cục bộ bình thường'));
let noidb=0,fin=0;window.onerror=m=>{const v=$('#v');if(v)v.insertAdjacentHTML('afterbegin','<div class="pn err">Lỗi: '+esc(m)+'</div>')};
S=seed();render();setS('Đang tải dữ liệu…','warn');
const okLoad=d=>{if(fin)return;fin=1;if(d&&d.skills)S=d;migrate();if(!d||!d.skills)save();render();setS('Đã tải dữ liệu đã lưu','ok');initStore()};
load().then(okLoad,()=>okLoad(null));
setTimeout(()=>{if(!fin){fin=1;noidb=1;setS('Không truy cập được bộ nhớ trình duyệt: dữ liệu chỉ tạm thời','err')}},3500);
</script></body></html>
